# litd on regtest. Throwaway setup for local tests and the fallback recording.
lnd-mode=integrated
network=regtest
httpslisten=0.0.0.0:8443
uipassword=regtest-only-password
autopilot.disable=true

lnd.alias=bank
lnd.noseedbackup=true
lnd.listen=0.0.0.0:9735
lnd.rpclisten=0.0.0.0:10009
lnd.restlisten=0.0.0.0:8080
lnd.tlsextradomain=bank
lnd.tlsextradomain=localhost
lnd.db.backend=sqlite
lnd.bitcoin.active=true
lnd.bitcoin.node=bitcoind
lnd.bitcoin.defaultchanconfs=1
lnd.bitcoind.rpchost=bitcoind:18443
lnd.bitcoind.rpcuser=regtest
lnd.bitcoind.rpcpass=regtest
lnd.bitcoind.zmqpubrawblock=tcp://bitcoind:28332
lnd.bitcoind.zmqpubrawtx=tcp://bitcoind:28333
